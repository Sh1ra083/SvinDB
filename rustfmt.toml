# Форматирование подобрано под дерево, а не дерево под умолчания.
#
# Цель этого файла — не соответствие чужому вкусу, а ворота CI, которые
# останутся зелёными и не будут переписывать код при каждом обновлении. Поэтому
# значения выбраны замером: полный `cargo fmt --all --check` прогонялся на сетке
# настроек, и брался вариант с наименьшим числом расхождений.
#
# | настройка                      | расхождений |
# |--------------------------------|-------------|
# | умолчание (100 / Default)      |        2059 |
# | 90 / Max                       |        1403 |
# | 120 / Default                  |        1450 |
# | **100 / Max**                  |     **849** |
#
# `use_small_heuristics = "Max"` — не украшение: дерево писалось с плотными
# однострочными структурами и вызовами, и умолчание разбивало бы их на четыре
# строки каждое, раздувая правку втрое без единого выигрыша в читаемости.
#
# Чего здесь намеренно нет: `wrap_comments`, `normalize_comments` и
# `format_code_in_doc_comments`. Все три доступны только на nightly, а их
# умолчания (выключено) — ровно то, что нужно: около половины дерева составляет
# русская проза в doc-комментариях, и переносить её по ширине значило бы ломать
# абзацы, которые расставлены по смыслу.
edition = "2021"
max_width = 100
use_small_heuristics = "Max"
