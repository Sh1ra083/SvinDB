# Один компилятор на разработку, CI и измерительный стенд.
#
# Без пина «clippy красный» невоспроизводим: аудит записал exit 0, а поздний
# прогон дал семь десятков строк — разница оказалась не в коде, а в том, что
# рабочая машина стояла на 1.95, а стенд на 1.97. Замер производительности
# страдает тем же: смена версии двигает inline-решения и раскладку кода, и
# дельта в проценты становится неотличима от смены компилятора.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
