<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a SvinDB segment</title>
  <desc id="desc">How the dictionary, term metadata, postings, positions, norms, typed columns, stored content and service files fit together inside an immutable segment.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="arrow"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .title { font-size: 24px; font-weight: 600; }
      .label { font-size: 16px; font-weight: 600; }
      .body { font-size: 13px; fill: #57606a; }
      .tiny { font-size: 11px; fill: #57606a; }
      .shell { fill: none; stroke: #8c959f; stroke-width: 1.5; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
      .accent { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.4; }
      .green { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.4; }
      .muted { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1.1; }
      .skip { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.1; stroke-dasharray: 5 4; opacity: .62; }
      .line { fill: none; stroke: #0969da; stroke-width: 1.8; marker-end: url(#arrow); }
      .arrow { fill: #0969da; }
      .divider { stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="610" class="canvas"/>

  <text x="48" y="42" class="title">Immutable segment</text>
  <text x="48" y="66" class="body">Parts are separated by purpose and stored in one seg.dat file; it is mapped once and a query reads only the pages it needs</text>

  <rect x="48" y="92" width="1104" height="442" rx="12" class="shell"/>
  <text x="76" y="124" class="label">segNNNN</text>
  <text x="1075" y="124" text-anchor="end" class="tiny">head.tsv · format · fields · counters · seg.dat length</text>

  <rect x="82" y="153" width="172" height="88" rx="8" class="accent"/>
  <text x="168" y="184" text-anchor="middle" class="label">Dictionary</text>
  <text x="168" y="207" text-anchor="middle" class="body">dict.blob · dict.idx</text>
  <text x="168" y="226" text-anchor="middle" class="tiny">term → list number</text>

  <rect x="306" y="153" width="178" height="88" rx="8" class="box"/>
  <text x="395" y="184" text-anchor="middle" class="label">Term metadata</text>
  <text x="395" y="207" text-anchor="middle" class="body">terms.bin · terms.idx</text>
  <text x="395" y="226" text-anchor="middle" class="tiny">df · offsets · layout</text>

  <rect x="536" y="143" width="352" height="108" rx="8" class="green"/>
  <text x="712" y="171" text-anchor="middle" class="label">Postings in blocks of 128</text>
  <rect x="558" y="190" width="62" height="38" rx="5" class="muted"/>
  <rect x="632" y="190" width="62" height="38" rx="5" class="skip"/>
  <rect x="706" y="190" width="62" height="38" rx="5" class="muted"/>
  <rect x="780" y="190" width="62" height="38" rx="5" class="skip"/>
  <text x="589" y="214" text-anchor="middle" class="tiny">read</text>
  <text x="663" y="214" text-anchor="middle" class="tiny">skip</text>
  <text x="737" y="214" text-anchor="middle" class="tiny">read</text>
  <text x="811" y="214" text-anchor="middle" class="tiny">skip</text>

  <rect x="940" y="153" width="176" height="88" rx="8" class="box"/>
  <text x="1028" y="184" text-anchor="middle" class="label">Positions</text>
  <text x="1028" y="207" text-anchor="middle" class="body">pos.bin · pos.idx</text>
  <text x="1028" y="226" text-anchor="middle" class="tiny">phrases and word order</text>

  <path d="M254 197H306" class="line"/>
  <path d="M484 197H536" class="line"/>
  <path d="M888 197H940" class="line"/>

  <text x="82" y="292" class="label">Per-document or per-slot data</text>
  <line x1="82" y1="307" x2="1116" y2="307" class="divider"/>

  <rect x="82" y="334" width="184" height="104" rx="8" class="box"/>
  <text x="174" y="364" text-anchor="middle" class="label">Norms</text>
  <text x="174" y="389" text-anchor="middle" class="body">norms.bin</text>
  <text x="174" y="412" text-anchor="middle" class="tiny">field length → BM25F</text>

  <rect x="292" y="334" width="232" height="104" rx="8" class="accent"/>
  <text x="408" y="364" text-anchor="middle" class="label">Typed columns</text>
  <text x="408" y="389" text-anchor="middle" class="body">dense / sparse · min / max</text>
  <text x="408" y="412" text-anchor="middle" class="tiny">range · sort · exists · aggs</text>

  <rect x="550" y="334" width="184" height="104" rx="8" class="box"/>
  <text x="642" y="364" text-anchor="middle" class="label">Stored content</text>
  <text x="642" y="389" text-anchor="middle" class="body">*.sbin · *.smrk</text>
  <text x="642" y="412" text-anchor="middle" class="tiny">fetch and highlight</text>

  <rect x="760" y="334" width="164" height="104" rx="8" class="box"/>
  <text x="842" y="364" text-anchor="middle" class="label">ID</text>
  <text x="842" y="389" text-anchor="middle" class="body">ids · idmap</text>
  <text x="842" y="412" text-anchor="middle" class="tiny">replace and delete</text>

  <rect x="950" y="334" width="166" height="104" rx="8" class="box"/>
  <text x="1033" y="364" text-anchor="middle" class="label">Visibility</text>
  <text x="1033" y="389" text-anchor="middle" class="body">live.bin</text>
  <text x="1033" y="412" text-anchor="middle" class="tiny">1 bit per doc · outside seg.dat</text>

  <rect x="82" y="470" width="1034" height="40" rx="7" class="muted"/>
  <text x="599" y="495" text-anchor="middle" class="body">mmap → OS page cache → hot pages stay in RAM, cold pages stay on disk</text>

  <text x="48" y="572" class="body">Solid frame: a block that is read. Dashed frame: a block the cursor may skip by its upper bound or its limits.</text>
</svg>
