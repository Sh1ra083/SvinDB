<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">A nested array in the SvinDB slot space</title>
  <desc id="desc">One root document owns a range of slots for the reactions array. The emoji and count fields of one element share the same ordinal, so a nested query never mixes different elements.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="arrow"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .title { font-size: 24px; font-weight: 600; }
      .label { font-size: 16px; font-weight: 600; }
      .body { font-size: 13px; fill: #57606a; }
      .tiny { font-size: 11px; fill: #57606a; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; }
      .root { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .slot { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
      .match { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.6; }
      .query { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
      .line { fill: none; stroke: #0969da; stroke-width: 1.8; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #1a7f37; stroke-width: 2; marker-end: url(#arrow); }
      .arrow { fill: #0969da; }
      .divider { stroke: #d0d7de; stroke-width: 1; }
      .no { fill: #cf222e; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="540" class="canvas"/>

  <text x="48" y="42" class="title">Nested arrays without child documents</text>
  <text x="48" y="66" class="body">An array gets its own ordinal space; the fields of one element are tied together by the slot number</text>

  <rect x="48" y="116" width="244" height="292" rx="10" class="root"/>
  <text x="170" y="151" text-anchor="middle" class="label">root document 1607817</text>
  <line x1="72" y1="171" x2="268" y2="171" class="divider"/>
  <text x="78" y="202" class="body">channel_id</text>
  <text x="262" y="202" text-anchor="end" class="body">42</text>
  <text x="78" y="230" class="body">message</text>
  <text x="262" y="230" text-anchor="end" class="body">Hello, world…</text>
  <text x="78" y="258" class="body">views</text>
  <text x="262" y="258" text-anchor="end" class="body">4289</text>
  <rect x="72" y="292" width="196" height="78" rx="7" class="box"/>
  <text x="170" y="319" text-anchor="middle" class="label">group reactions</text>
  <text x="170" y="343" text-anchor="middle" class="body">arity = 3</text>
  <text x="170" y="360" text-anchor="middle" class="tiny">range = [41, 44)</text>

  <path d="M292 331H352" class="line"/>

  <text x="376" y="109" class="label">Slots of the reactions group</text>
  <rect x="352" y="126" width="370" height="86" rx="8" class="match"/>
  <text x="374" y="157" class="label">slot 41</text>
  <text x="478" y="157" class="body">emoji = 👍</text>
  <text x="478" y="184" class="body">count = 8</text>
  <text x="694" y="174" text-anchor="end" class="tiny">one element</text>

  <rect x="352" y="230" width="370" height="86" rx="8" class="slot"/>
  <text x="374" y="261" class="label">slot 42</text>
  <text x="478" y="261" class="body">emoji = 🤣</text>
  <text x="478" y="288" class="body">count = 3</text>
  <text x="694" y="278" text-anchor="end" class="tiny">one element</text>

  <rect x="352" y="334" width="370" height="86" rx="8" class="slot"/>
  <text x="374" y="365" class="label">slot 43</text>
  <text x="478" y="365" class="body">emoji = 👏</text>
  <text x="478" y="392" class="body">count = 1</text>
  <text x="694" y="382" text-anchor="end" class="tiny">one element</text>

  <rect x="790" y="126" width="356" height="132" rx="10" class="query"/>
  <text x="968" y="160" text-anchor="middle" class="label">nested query</text>
  <line x1="816" y1="178" x2="1120" y2="178" class="divider"/>
  <text x="968" y="207" text-anchor="middle" class="body">emoji = 👍 AND count ≥ 5</text>
  <text x="968" y="234" text-anchor="middle" class="tiny">both conditions are checked on one slot</text>

  <path d="M790 191H758Q742 191 742 169H722" class="line-green"/>
  <path d="M790 226H764Q748 226 748 248V439Q748 455 732 455H308Q292 455 292 439V408" class="line-green"/>

  <rect x="790" y="306" width="356" height="114" rx="10" class="box"/>
  <text x="968" y="339" text-anchor="middle" class="label">Correlation is preserved</text>
  <text x="968" y="369" text-anchor="middle" class="body">👍 is in slot 41, count = 3 is in slot 42</text>
  <text x="968" y="398" text-anchor="middle" class="no">emoji = 👍 AND count = 3 → no match</text>

  <text x="48" y="486" class="body">Root document numbers, norms and the live map are not multiplied by the number of array elements.</text>
</svg>
