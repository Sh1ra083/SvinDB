<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SvinDB architecture overview</title>
  <desc id="desc">Ingest and search path from the client through the server boundary to the streaming indexer, the search core and a set of immutable segments.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="arrow-blue"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" class="arrow-green"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
      .title { font-size: 24px; font-weight: 600; }
      .label { font-size: 17px; font-weight: 600; }
      .body { font-size: 14px; fill: #57606a; }
      .small { font-size: 12px; fill: #57606a; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .server { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
      .write { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .read { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
      .storage { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .segment { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1.2; }
      .line-blue { fill: none; stroke: #0969da; stroke-width: 2; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #1a7f37; stroke-width: 2; marker-end: url(#arrow-green); }
      .arrow-blue { fill: #0969da; }
      .arrow-green { fill: #1a7f37; }
      .divider { stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="560" class="canvas"/>

  <text x="48" y="42" class="title">Data path</text>
  <text x="48" y="66" class="body">One boundary, two independent hot paths, one shared set of immutable segments</text>

  <rect x="48" y="185" width="150" height="150" rx="10" class="box"/>
  <text x="123" y="225" text-anchor="middle" class="label">Client</text>
  <line x1="72" y1="244" x2="174" y2="244" class="divider"/>
  <text x="123" y="272" text-anchor="middle" class="body">HTTP JSON</text>
  <text x="123" y="296" text-anchor="middle" class="body">NDJSON</text>
  <text x="123" y="320" text-anchor="middle" class="body">CLI</text>

  <rect x="252" y="135" width="210" height="250" rx="10" class="server"/>
  <text x="357" y="174" text-anchor="middle" class="label">svindb-server</text>
  <line x1="276" y1="194" x2="438" y2="194" class="divider"/>
  <text x="357" y="226" text-anchor="middle" class="body">HTTP and commands</text>
  <text x="357" y="252" text-anchor="middle" class="body">JSON and schema</text>
  <text x="357" y="278" text-anchor="middle" class="body">auth and CORS</text>
  <text x="357" y="304" text-anchor="middle" class="body">bounds checks</text>
  <text x="357" y="352" text-anchor="middle" class="small">the core has no socket code</text>

  <rect x="528" y="102" width="250" height="150" rx="10" class="write"/>
  <text x="653" y="140" text-anchor="middle" class="label">Streaming ingest</text>
  <line x1="552" y1="160" x2="754" y2="160" class="divider"/>
  <text x="653" y="188" text-anchor="middle" class="body">analyzer → postings</text>
  <text x="653" y="212" text-anchor="middle" class="body">columns → buffer</text>
  <text x="653" y="236" text-anchor="middle" class="small">flush publishes a new segment</text>

  <rect x="528" y="308" width="250" height="150" rx="10" class="read"/>
  <text x="653" y="346" text-anchor="middle" class="label">Search core</text>
  <line x1="552" y1="366" x2="754" y2="366" class="divider"/>
  <text x="653" y="394" text-anchor="middle" class="body">dictionary → cursors</text>
  <text x="653" y="418" text-anchor="middle" class="body">filters → exact top-K</text>
  <text x="653" y="442" text-anchor="middle" class="small">per-segment top lists are merged</text>

  <rect x="844" y="92" width="308" height="376" rx="12" class="storage"/>
  <text x="998" y="128" text-anchor="middle" class="label">Index directory</text>
  <rect x="872" y="151" width="118" height="52" rx="7" class="box"/>
  <text x="931" y="173" text-anchor="middle" class="body">schema.json</text>
  <text x="931" y="191" text-anchor="middle" class="small">stable fields</text>
  <rect x="1006" y="151" width="118" height="52" rx="7" class="box"/>
  <text x="1065" y="173" text-anchor="middle" class="body">WAL</text>
  <text x="1065" y="191" text-anchor="middle" class="small">recovery</text>
  <rect x="872" y="219" width="252" height="44" rx="7" class="box"/>
  <text x="998" y="247" text-anchor="middle" class="body">manifest → visible segments</text>

  <rect x="872" y="287" width="72" height="118" rx="8" class="segment"/>
  <rect x="958" y="287" width="72" height="118" rx="8" class="segment"/>
  <rect x="1052" y="287" width="72" height="118" rx="8" class="segment"/>
  <text x="908" y="320" text-anchor="middle" class="small">seg0000</text>
  <text x="994" y="320" text-anchor="middle" class="small">seg0001</text>
  <text x="1088" y="320" text-anchor="middle" class="small">segNNNN</text>
  <path d="M888 342h40M888 358h40M888 374h40" class="divider"/>
  <path d="M974 342h40M974 358h40M974 374h40" class="divider"/>
  <path d="M1068 342h40M1068 358h40M1068 374h40" class="divider"/>
  <text x="998" y="438" text-anchor="middle" class="small">mmap · the OS loads pages</text>

  <path d="M198 228H252" class="line-blue"/>
  <path d="M462 205H496Q512 205 512 189V177H528" class="line-blue"/>
  <path d="M778 177H812Q828 177 828 193V316Q828 332 844 332" class="line-blue"/>

  <path d="M844 391H812Q796 391 796 383H778" class="line-green"/>
  <path d="M528 383H496Q480 383 480 367V325Q480 309 462 309" class="line-green"/>
  <path d="M252 309H224Q208 309 208 293V276Q208 260 198 260" class="line-green"/>

  <circle cx="548" cy="500" r="5" fill="#0969da"/>
  <text x="562" y="505" class="small">ingest</text>
  <circle cx="642" cy="500" r="5" fill="#1a7f37"/>
  <text x="656" y="505" class="small">search</text>
</svg>
