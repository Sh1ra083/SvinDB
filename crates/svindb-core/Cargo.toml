[package]
name = "svindb-core"
version = "3.0.0-alpha.3"
edition = "2021"

# Счётчики обхода по умолчанию выключены и включаются отдельной возможностью.
[features]
stats = []
# Тяжёлый счёт распределителя включается только отдельной профилировочной
# сборкой и не загрязняет канонический performance binary.
alloc-stats = []
# Управляемые падения на пути долговечности. Без возможности каждая точка —
# пустая функция, и релизный двоичный файл побайтово равен сборке без неё.
failpoints = []

[dependencies]
rayon = "=1.12.0"
